<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ติดตามงาน ห้องวางแผน แขวงทางหลวงนครสวรรค์ที่ 2</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --black:#000;
  --bg:#0d0d0d;
  --card:#181818;
  --card2:#222;
  --line:#2e2e2e;
  --text:#f4f4f4;
  --mute:#a3a3a3;
  --yellow:#ffc400;
  --yellow-d:#e0a900;
  --red:#ff5d4f;
  --green:#4cd07d;
  --blue:#6aa8ff;
  --head:'Prompt','Sarabun','Noto Sans Thai',sans-serif;
  --body:'Sarabun','Noto Sans Thai',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;color-scheme:dark}
body{background:var(--bg);color:var(--text);font:400 16px/1.55 var(--body);min-height:100vh;padding-bottom:88px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{font-family:var(--head);font-weight:600;line-height:1.3}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
[hidden]{display:none!important}

/* header */
.top{background:var(--black)}
.top-in{max-width:1100px;margin:auto;display:flex;align-items:center;gap:14px;padding:14px 16px}
.logo{width:60px;height:60px;border-radius:50%;flex:none;border:0;background:none;padding:0;overflow:hidden;position:relative}
.logo svg{width:100%;height:100%;display:block}
.brand{flex:1;min-width:0}
.brand small{display:block;font:600 13px var(--head);color:var(--yellow)}
.brand h1{font-size:clamp(18px,4.8vw,27px);color:#fff;font-weight:700}
.top-actions{display:flex;align-items:center;gap:8px;flex:none}
.conn{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:5px 11px}
.conn i{width:9px;height:9px;border-radius:50%;background:#666;flex:none}
.conn.on i{background:var(--green)} .conn.on{color:var(--text)}
.conn.warn i{background:var(--yellow)}
@media(max-width:560px){.conn b{display:none}.conn{padding:8px}}
.stripe{height:10px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 14px,#000 14px 28px)}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--black);border-top:2px solid var(--yellow);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;background:none;border:0;color:var(--mute);padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;font:600 12.5px var(--body);position:relative}
.nav svg{width:23px;height:23px}
.nav button.on{color:var(--yellow)}
.nav .badge{position:absolute;top:3px;left:calc(50% + 7px);min-width:19px;height:19px;border-radius:99px;background:var(--yellow);color:#000;font:700 11.5px/19px var(--head);text-align:center;padding:0 5px}
@media(min-width:760px){
  body{padding-bottom:48px}
  .nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);justify-content:center;gap:4px;padding:0}
  .nav button{flex:none;flex-direction:row;gap:9px;padding:15px 24px;font-size:15.5px}
  .nav button.on{box-shadow:inset 0 -4px 0 var(--yellow)}
  .nav .badge{position:static;margin-left:2px}
}

/* layout */
main{max-width:1100px;margin:auto;padding:18px 16px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--card);border:1px dashed var(--yellow);border-radius:12px;padding:12px 14px;margin-bottom:16px;font-size:14.5px}
.banner b{color:var(--yellow)}
.banner .btn{flex:none;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:22px}
@media(min-width:760px){.stats{grid-template-columns:repeat(4,1fr)}}
.tile{background:var(--card);border:0;border-left:6px solid var(--yellow);border-radius:4px 12px 12px 4px;padding:12px 14px;text-align:left;display:block;width:100%}
.tile strong{display:block;font:700 34px/1.1 var(--head);color:var(--yellow)}
.tile span{font-size:14px;color:var(--mute)}
@media(max-width:759px){.tile{padding:8px 12px}.tile strong{font-size:27px}.tile span{font-size:13px;line-height:1.3;display:block}.stats{gap:8px;margin-bottom:16px}}
.tile.bad{border-left-color:var(--red)} .tile.bad strong{color:var(--red)}
.tile.warn strong{color:#fff}

.vhead{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:14px}
.vhead h2{font-size:21px}
.centerline{height:3px;margin:0 0 16px;background:repeating-linear-gradient(90deg,var(--yellow) 0 22px,transparent 22px 40px);opacity:.9}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.toolbar .grow{flex:1;min-width:160px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mute);border-radius:99px;padding:6px 14px;font-size:14.5px}
.chip em{font-style:normal;font-weight:700;margin-left:4px}
.chip.on{background:var(--yellow);border-color:var(--yellow);color:#000;font-weight:700}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--yellow);color:#000;border:2px solid var(--yellow);border-radius:10px;padding:10px 18px;font:700 15px var(--body);text-decoration:none;line-height:1.2}
.btn:hover{background:var(--yellow-d);border-color:var(--yellow-d)}
.btn.ghost{background:transparent;color:var(--text);border-color:#4a4a4a}
.btn.ghost:hover{border-color:var(--yellow);color:var(--yellow)}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:8px}
.btn svg,.icon-btn svg{width:18px;height:18px;flex:none}
.icon-btn{background:none;border:1px solid transparent;color:var(--mute);width:40px;height:40px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{color:var(--yellow);border-color:var(--line)}
.icon-btn.danger:hover{color:var(--red)}
.icon-btn.sm{width:34px;height:34px}
.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin svg{animation:none}}
input,select,textarea{width:100%;background:#000;border:1.5px solid #3a3a3a;border-radius:10px;padding:10px 12px;color:var(--text)}
input:focus,select:focus,textarea:focus{border-color:var(--yellow);outline:none}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--yellow);flex:none}
label{display:block;font-size:14px;color:var(--mute);margin-bottom:12px}
label input,label select,label textarea{margin-top:5px;font-size:16px}
label.chk{display:flex;gap:10px;align-items:center;color:var(--text);font-size:15px}
label.chk input{margin:0}

/* cards */
.card{background:var(--card);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;gap:12px}
@media(min-width:900px){.grid.cols2{grid-template-columns:1fr 1fr}}
.task{display:flex;gap:10px;align-items:flex-start;border-left:6px solid #555;border-radius:4px 12px 12px 4px}
.task.pr-high{border-left-color:var(--red)}
.task.pr-mid{border-left-color:var(--yellow)}
.task.st-done{opacity:.6}
.task.st-done h3{text-decoration:line-through}
.tbody{flex:1;min-width:0;cursor:pointer}
.tbody h3{font-size:17px;margin:4px 0 6px;overflow-wrap:anywhere}
.tactions{display:flex;flex-direction:column;gap:6px;align-items:flex-end}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:14px;color:var(--mute)}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:15px;height:15px;flex:none}
.meta .bad{color:var(--red);font-weight:600}
.meta .warn{color:var(--yellow);font-weight:600}
.tag{display:inline-block;border-radius:6px;padding:1px 9px;font:600 12.5px var(--body);background:#2b2b2b;color:var(--text);margin-right:6px}
.tag.p-high{background:var(--red);color:#000}
.tag.p-mid{background:var(--yellow);color:#000}
.tag.created{background:var(--green);color:#000}
.tag.updated{background:var(--blue);color:#000}
.tag.duetag{background:#000;color:var(--yellow);border:1.5px solid var(--yellow)}
.stbtn{background:#000;border:1.5px solid #444;border-radius:8px;padding:5px 10px;font-size:13.5px;white-space:nowrap}
.stbtn.st-doing{border-color:var(--yellow);color:var(--yellow)}
.stbtn.st-done{border-color:var(--green);color:var(--green)}

.dayhead{font:600 15px var(--head);color:var(--yellow);margin:20px 0 8px}
.dayhead small{color:var(--mute);font:400 14px var(--body);margin-left:8px}
.meet{display:flex;gap:14px;align-items:flex-start}
.mtime{flex:none;width:92px;font:600 15px var(--head);color:var(--yellow);padding-top:2px}
.mbody{flex:1;min-width:0}
.mbody h3{font-size:17px;margin-bottom:4px;overflow-wrap:anywhere}
.mact{display:flex;gap:2px;flex:none}
.pend{color:var(--yellow);font-size:12.5px;font-weight:600}

.alert{display:flex;gap:14px;align-items:flex-start}
.alert.unread{box-shadow:inset 4px 0 0 var(--yellow)}
.alert.done{opacity:.6}
.ftype{flex:none;width:50px;height:58px;border-radius:6px;border:2px solid var(--c);color:var(--c);font:700 13px var(--head);display:flex;align-items:flex-end;justify-content:center;padding-bottom:7px;position:relative;background:#000}
.ftype::before{content:"";position:absolute;top:-2px;right:-2px;width:14px;height:14px;background:linear-gradient(225deg,var(--card) 50%,var(--c) 50%);border-bottom-left-radius:4px}
.abody{flex:1;min-width:0}
.abody h3{font-size:17px;margin:6px 0;overflow-wrap:anywhere}
.arow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}
.prog{margin-top:10px}
.bar{height:12px;border-radius:99px;background:#000;border:1px solid #3a3a3a;position:relative;overflow:hidden}
.bar::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;background:repeating-linear-gradient(90deg,#555 0 8px,transparent 8px 16px)}
.bar i{display:block;height:100%;background:var(--yellow);position:relative;z-index:1}
.bar.hz i{background:repeating-linear-gradient(-45deg,var(--yellow) 0 8px,#000 8px 16px)}
.prog small{display:block;margin-top:5px;font-size:13.5px;color:var(--mute)}
.alert.due .prog small{color:var(--yellow);font-weight:600}

.empty{text-align:center;color:var(--mute);padding:38px 12px;border:1.5px dashed var(--line);border-radius:12px}
.empty b{display:block;color:var(--text);font:600 17px var(--head);margin-bottom:4px}

/* settings */
.card h3{font-size:18px;margin-bottom:6px}
.hint{font-size:14px;color:var(--mute);margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.flist{list-style:none;margin:10px 0}
.flist li{display:flex;align-items:center;gap:10px;background:#000;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:8px}
.flist li div{flex:1;min-width:0}
.flist small{display:block;color:var(--mute);font-size:12.5px;overflow:hidden;text-overflow:ellipsis}
.three{display:grid;gap:10px;grid-template-columns:1fr}
@media(min-width:620px){.three{grid-template-columns:1fr 2fr auto;align-items:end}.three .btn{margin-bottom:12px}}
details.guide{margin-top:14px;border-top:1px solid var(--line);padding-top:12px}
details.guide summary{cursor:pointer;color:var(--yellow);font-weight:600}
details.guide ol{margin:10px 0 0 20px;font-size:14.5px;color:var(--mute)}
details.guide li{margin-bottom:6px}
details.guide code{background:#000;padding:1px 6px;border-radius:5px;color:var(--text);font-size:13px}

/* modal + toast */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));border-top:5px solid var(--yellow)}
@media(min-width:620px){.overlay{align-items:center}.sheet{border-radius:16px}}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.mh h2{font-size:21px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mf{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
#toasts{position:fixed;left:12px;right:12px;bottom:96px;z-index:80;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
@media(min-width:760px){#toasts{bottom:24px}}
.toast{pointer-events:auto;background:var(--yellow);color:#000;font-weight:600;border-radius:10px;padding:10px 14px;display:flex;gap:14px;align-items:center;max-width:520px;box-shadow:0 6px 24px rgba(0,0,0,.6);font-size:15px}
.toast.err{background:var(--red)}
.toast button{background:#000;color:var(--yellow);border:0;border-radius:7px;padding:5px 11px;font-weight:700}
</style>
</head>
<body>

<header class="top">
  <div class="top-in">
    <div class="logo">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="30" fill="#000" stroke="#ffc400" stroke-width="3"/><path d="M28 14h8l17 36H11z" fill="#ffc400"/><path d="M32 17v33" stroke="#000" stroke-width="2.6" stroke-dasharray="5 4"/><path d="M18 52h28" stroke="#000" stroke-width="1.5"/></svg>
    </div>
    <div class="brand">
      <small>ห้องวางแผน</small>
      <h1>แขวงทางหลวงนครสวรรค์ที่ 2</h1>
    </div>
    <div class="top-actions">
      <span class="conn on" id="connChip"><i></i><b>Database Online</b></span>
      <button class="icon-btn" id="syncBtn" data-act="sync-all" aria-label="ซิงก์ข้อมูลตอนนี้" title="ซิงก์ข้อมูลตอนนี้"></button>
    </div>
  </div>
</header>
<div class="stripe"></div>

<nav class="nav" id="nav" aria-label="เมนูหลัก">
  <button data-view="tasks"></button>
  <button data-view="meetings"></button>
  <button data-view="alerts"></button>
  <button data-view="settings"></button>
</nav>

<main>
  <section class="stats" id="stats"></section>

  <section id="view-tasks">
    <div class="vhead"><h2>งานปัจจุบัน</h2><button class="btn" data-act="add-task" id="addTaskBtn"></button></div>
    <div class="centerline"></div>
    <div class="toolbar">
      <input class="grow" id="t-search" type="search" placeholder="ค้นหาชื่องานหรือผู้รับผิดชอบ" aria-label="ค้นหางาน">
    </div>
    <div class="chips" id="t-chips" style="margin-bottom:14px"></div>
    <div id="t-list" class="grid cols2"></div>
  </section>

  <section id="view-meetings" hidden>
    <div class="vhead"><h2>การประชุม</h2><button class="btn" data-act="add-meeting" id="addMeetBtn"></button></div>
    <div class="centerline"></div>
    <div class="row" style="margin-bottom:6px;justify-content:space-between">
      <div class="chips" id="m-chips"></div>
      <small id="m-sync" style="color:var(--mute)"></small>
    </div>
    <div id="m-list"></div>
  </section>

  <section id="view-alerts" hidden>
    <div class="vhead"><h2>แจ้งเตือนไฟล์ใน Drive</h2><button class="btn" data-act="scan-drive" id="scanBtn"></button></div>
    <div class="centerline"></div>
    <div class="row" style="margin-bottom:14px;justify-content:space-between">
      <div class="chips" id="a-chips"></div>
      <small id="a-sync" style="color:var(--mute)"></small>
    </div>
    <div id="a-list" class="grid cols2"></div>
  </section>

  <section id="view-settings" hidden>
    <div class="vhead"><h2>ตั้งค่าระบบ</h2></div>
    <div class="centerline"></div>
    <div id="settings"></div>
  </section>
</main>

<div id="modal" class="overlay" hidden></div>
<div id="toasts" aria-live="polite"></div>

<script>
(()=>{
'use strict';

const API_URL = 'https://script.google.com/macros/s/AKfycbxeHyUZM8o30e1h4CTL0ZFNHvxX4AJRy1qa2CEfEcojSNVN_oQek7M2bRSgQHjURr3uYg/exec';
const CLIENT_ID = '540842192388-8m160b7lm4m3fh8gjd9b56iu775c88g0.apps.googleusercontent.com';
const CALENDAR_ID = 'primary';
const KEY='hwn2.planning.v2';
const TZ='Asia/Bangkok';
const DAY=864e5;
const SCOPES='https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/drive.metadata.readonly';
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const todayStr=()=>new Date().toLocaleDateString('sv-SE',{timeZone:TZ});
const addDays=(d,n)=>{const t=new Date(d+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/DAY);
const fmtDate=d=>d?new Date(d+'T00:00:00+07:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric',timeZone:TZ}):'';
const fmtLong=d=>new Date(d+'T00:00:00+07:00').toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric',timeZone:TZ});
const partsBKK=iso=>{const s=new Date(iso).toLocaleString('sv-SE',{timeZone:TZ});return{date:s.slice(0,10),time:s.slice(11,16)}};
const ago=iso=>{const m=Math.floor((Date.now()-new Date(iso))/6e4);if(m<1)return'เมื่อสักครู่';if(m<60)return m+' นาทีที่แล้ว';const h=Math.floor(m/60);if(h<24)return h+' ชั่วโมงที่แล้ว';return Math.floor(h/24)+' วันที่แล้ว'};
const P=d=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const I={
  plus:P('<path d="M12 5v14M5 12h14"/>'),
  trash:P('<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v6M14 11v6"/>'),
  cal:P('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'),
  user:P('<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>'),
  bell:P('<path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/>'),
  gear:P('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>'),
  list:P('<path d="M9 6h12M9 12h12M9 18h12M3 6l1 1 2-2M3 12l1 1 2-2M3 18l1 1 2-2"/>'),
  sync:P('<path d="M21 12a9 9 0 0 1-15.5 6.2M3 12A9 9 0 0 1 18.5 5.8M18 2v4h-4M6 22v-4h4"/>'),
  pin:P('<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>'),
  clock:P('<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>'),
  folder:P('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
  edit:P('<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/>'),
  x:P('<path d="M6 6l12 12M18 6L6 18"/>'),
  ext:P('<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>'),
  check:P('<path d="M5 12l5 5L20 7"/>')
};

const STAT={todo:'รอดำเนินการ',doing:'กำลังดำเนินการ',done:'เสร็จสิ้น'};
const PRIO={low:'ปกติ',mid:'สำคัญ',high:'ด่วน'};
const opt=(m,v)=>Object.entries(m).map(([k,l])=>`<option value="${k}"${k===v?' selected':''}>${l}</option>`).join('');
const chips=(m,cur,cnt,act)=>Object.entries(m).map(([k,l])=>`<button class="chip${k===cur?' on':''}" data-act="${act}" data-v="${k}">${l}${cnt?`<em>${cnt(k)}</em>`:''}</button>`).join('');
const empty=(t,s)=>`<div class="empty" style="grid-column:1/-1"><b>${t}</b>${s||''}</div>`;

    tasks:[], meetings:[], alerts:[],
    pendingDeletes:[],lastCalSync:null,lastDriveScan:null,wasLoaded:false

function toast(msg,kind,act){
  const w=$('#toasts'),el=document.createElement('div');
  el.className='toast '+(kind||'');
  const sp=document.createElement('span');sp.textContent=msg;el.appendChild(sp);
  if(act){const b=document.createElement('button');b.textContent=act.label;b.onclick=()=>{act.fn();el.remove()};el.appendChild(b)}
  w.appendChild(el);setTimeout(()=>el.remove(),act?7000:kind==='err'?7000:4200);
}

let token=null,tokExp=0,gisP=null;
try{const t=JSON.parse(sessionStorage.getItem('hwn2.tok')||'null');if(t&&t.exp>Date.now()){token=t.v;tokExp=t.exp}}catch(e){}
const isConnected=()=>!!token&&Date.now()<tokExp-30000;
function loadGIS(){
  if(window.google&&google.accounts&&google.accounts.oauth2)return Promise.resolve();
  if(gisP)return gisP;
  gisP=new Promise((res,rej)=>{const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.onload=res;s.onerror=()=>{gisP=null;rej(new Error('โหลดระบบเข้าสู่ระบบของ Google ไม่ได้ ตรวจสอบอินเทอร์เน็ต'))};document.head.appendChild(s)});
  return gisP;
}
async function getToken(){
  if(isConnected())return token;
  await loadGIS();
  return new Promise((res,rej)=>{
    const c=google.accounts.oauth2.initTokenClient({
      client_id:CLIENT_ID,scope:SCOPES,
      callback:r=>{
        if(r.error){rej(new Error(r.error_description||r.error));return}
        token=r.access_token;tokExp=Date.now()+(r.expires_in||3600)*1000;
        try{sessionStorage.setItem('hwn2.tok',JSON.stringify({v:token,exp:tokExp}))}catch(e){}
        renderSettings();res(token);
      },
      error_callback:e=>rej(new Error(e.type==='popup_closed'?'ปิดหน้าต่างเข้าสู่ระบบก่อนเสร็จ':(e.message||e.type||'เชื่อมต่อไม่สำเร็จ')))
    });
    c.requestAccessToken({prompt:''});
  });
}
async function gfetch(url,opt={},retry=true){
  const tk=await getToken();
  const r=await fetch(url,{...opt,headers:{'Authorization':'Bearer '+tk,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401&&retry){token=null;tokExp=0;try{sessionStorage.removeItem('hwn2.tok')}catch(e){}return gfetch(url,opt,false)}
  if(r.status===204)return null;
  if(r.status===404||r.status===410)return{__gone:true};
  const j=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((j&&j.error&&j.error.message)||('รหัสข้อผิดพลาด '+r.status));
  return j;
}

let isFetching = false;
function setBusy(b){$('#syncBtn').classList.toggle('spin',b);$('#scanBtn').classList.toggle('spin',b)}

async function syncGASData() {
  if (isFetching) return;
  isFetching = true;
  setBusy(true);
  try {
    const res = await fetch(API_URL);
    const json = await res.json();
    
    if (json.status === "success" && Array.isArray(json.data)) {
      const oldMeetingIds = new Set(S.meetings.map(m => m.id));
      let newMeetingsCount = 0;
      let newMeetingTitle = "";

      const fetchedTasks = [];
      const fetchedMeetings = [];
      const fetchedAlerts = [];

      json.data.forEach(item => {
        if (!item.id) return;
        
        // พยายาม Parse ค่า JSON จากคอลัมน์ detail
        let extraData = {};
        if (item.detail && item.detail.startsWith('{')) {
          try { extraData = JSON.parse(item.detail); } catch(e){}
        }

        if (item.id.startsWith('MEET-') || item.status === 'meeting') {
          fetchedMeetings.push({
            id: item.id,
            title: item.title || '(ไม่มีชื่อการประชุม)',
            date: item.dueDate || todayStr(),
            start: extraData.start || '09:00',
            end: extraData.end || '10:00',
            location: item.assignee || '',
            note: extraData.note || '',
            gcalId: item.gcalId || null,
            dirty: false
          });
          if (!oldMeetingIds.has(item.id) && S.wasLoaded) {
            newMeetingsCount++;
            newMeetingTitle = item.title;
          }
        } else if (item.id.startsWith('ALERT-') || item.status === 'alert') {
          fetchedAlerts.push({
            id: item.id,
            key: extraData.key || item.id,
            fileId: extraData.fileId || item.id,
            name: item.title || '(ไม่มีชื่อไฟล์)',
            kind: extraData.kind || 'updated',
            at: extraData.at || new Date().toISOString(),
            by: extraData.by || item.assignee || '',
            link: extraData.link || '',
            folderLink: extraData.folderLink || '',
            mime: extraData.mime || '',
            folder: extraData.folder || '',
            read: extraData.read === true || extraData.read === 'true',
            done: extraData.done === true || extraData.done === 'true',
            notified: true
          });
        } else {
          // ถ้าเป็น Task ทั่วไป (ไม่มี Prefix ชี้เฉพาะ และสถานะไม่ใช่ meeting/alert)
          // จัดการ fallback ให้ครอบคลุม
          let taskDetail = item.detail;
          if(extraData.note !== undefined) { taskDetail = extraData.note; }

          fetchedTasks.push({
            id: item.id,
            title: item.title || '(ไม่มีหัวข้อ)',
            note: taskDetail || '',
            status: (item.status === 'todo' || item.status === 'doing' || item.status === 'done') ? item.status : 'todo',
            owner: item.assignee || '',
            due: item.dueDate || '',
            priority: (item.priority === 'low' || item.priority === 'mid' || item.priority === 'high') ? item.priority : 'mid',
            syncCal: item.syncCal === true || item.syncCal === 'true',
            gcalId: item.gcalId || null,
            dirty: false
          });
        }
      });

      // อัปเดต State (ทับข้อมูลเดิมทั้งหมดด้วยข้อมูลจาก Sheets)
      S.tasks = fetchedTasks;
      S.meetings = fetchedMeetings;
      S.alerts = fetchedAlerts;
      S.wasLoaded = true;
      save();
      renderAll();

      if (newMeetingsCount > 0) {
        notifyBrowser("มีการประชุมใหม่ถูกเพิ่มเข้ามา", newMeetingsCount === 1 ? newMeetingTitle : `มีการประชุมใหม่ ${newMeetingsCount} รายการ`);
      }
    } else {
      console.error("Format ข้อมูลที่ได้จาก API ไม่ถูกต้อง", json);
    }
  } catch (err) {
    console.error("Fetch GAS data failed:", err);
  } finally {
    isFetching = false;
    setBusy(false);
  }
}

async function sendToGAS(action, itemType, itemData) {
  setBusy(true);
  try {
    let payloadData = {};
    if (itemType === 'meeting') {
      payloadData = {
        id: itemData.id,
        title: itemData.title,
        detail: JSON.stringify({ note: itemData.note || '', start: itemData.start || '', end: itemData.end || '' }),
        status: 'meeting',
        assignee: itemData.location || '',
        dueDate: itemData.date,
        priority: 'low',
        syncCal: false,
        gcalId: itemData.gcalId || ""
      };
    } else if (itemType === 'alert') {
      payloadData = {
        id: itemData.id.startsWith('ALERT-') ? itemData.id : 'ALERT-' + itemData.id,
        title: itemData.name || itemData.title || '',
        detail: JSON.stringify({
          key: itemData.key,
          fileId: itemData.fileId,
          kind: itemData.kind,
          at: itemData.at,
          by: itemData.by,
          link: itemData.link,
          folderLink: itemData.folderLink,
          mime: itemData.mime,
          folder: itemData.folder,
          read: itemData.read,
          done: itemData.done
        }),
        status: 'alert',
        assignee: itemData.by || '',
        dueDate: itemData.at ? itemData.at.slice(0, 10) : todayStr(),
        priority: 'low',
        syncCal: false,
        gcalId: ""
      };
    } else {
      // Task
      payloadData = {
        id: itemData.id,
        title: itemData.title,
        detail: itemData.note || '', // เก็บ note ลงช่อง detail
        status: itemData.status,
        assignee: itemData.owner || '',
        dueDate: itemData.due || '',
        priority: itemData.priority || 'mid',
        syncCal: itemData.syncCal || false,
        gcalId: itemData.gcalId || ""
      };
    }

    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({
        action: action,
        data: payloadData
      })
    });
    
    // Check Response Error
    if(!res.ok) {
       console.error("HTTP Error", res.status);
    }
    
  } catch (err) {
    console.error("ส่งข้อมูลไม่สำเร็จ", err);
    toast('บันทึกข้อมูลส่วนกลางไม่สำเร็จ: ' + err.message, 'err');
  } finally {
    setBusy(false);
  }
}

const calUrl=(p='')=>'https://www.googleapis.com/calendar/v3/calendars/'+encodeURIComponent(CALENDAR_ID)+'/events'+p;
const TASK_PREFIX=/^\[(งาน|งานเสร็จ)\]\s*/;
function meetingBody(m){
  const b={summary:m.title,location:m.location||'',description:m.note||'',extendedProperties:{private:{hwn2:'meeting'}}};
  if(m.start){b.start={dateTime:`${m.date}T${m.start}:00+07:00`,timeZone:TZ};b.end={dateTime:`${m.date}T${m.end||m.start}:00+07:00`,timeZone:TZ}}
  else{b.start={date:m.date};b.end={date:addDays(m.date,1)}}
  return b;
}
function taskBody(t){
  return{summary:(t.status==='done'?'[งานเสร็จ] ':'[งาน] ')+t.title,description:t.note||'',start:{date:t.due},end:{date:addDays(t.due,1)},
    extendedProperties:{private:{hwn2:'task',taskId:t.id,owner:t.owner||'',priority:t.priority,status:t.status}}};
}
async function upsertRemote(item,body){
  let r=null;
  if(item.gcalId){r=await gfetch(calUrl('/'+encodeURIComponent(item.gcalId)),{method:'PATCH',body:JSON.stringify(body)});if(r&&r.__gone)r=null}
  if(!r)r=await gfetch(calUrl(''),{method:'POST',body:JSON.stringify(body)});
  item.gcalId=r.id;item.remoteUpdated=r.updated;item.dirty=false;
  if(r.htmlLink)item.link=r.htmlLink;
}
async function pushCalendar(){
  for(const id of [...S.pendingDeletes]){
    await gfetch(calUrl('/'+encodeURIComponent(id)),{method:'DELETE'});
    S.pendingDeletes=S.pendingDeletes.filter(x=>x!==id);save();
  }
  for(const m of S.meetings.filter(x=>x.dirty))await upsertRemote(m,meetingBody(m));
  for(const t of S.tasks){
    if(t.syncCal&&t.due){if(t.dirty||!t.gcalId)await upsertRemote(t,taskBody(t))}
    else if(!t.syncCal&&t.gcalId){await gfetch(calUrl('/'+encodeURIComponent(t.gcalId)),{method:'DELETE'});t.gcalId=null;t.remoteUpdated=null;}
  }
}
function evToMeeting(ev){
  let date,start='',end='';
  if(ev.start.date){date=ev.start.date}
  else{const a=partsBKK(ev.start.dateTime),b=partsBKK(ev.end.dateTime);date=a.date;start=a.time;end=b.time}
  return{gcalId:ev.id,title:ev.summary||'(ไม่มีชื่อ)',date,start,end,location:ev.location||'',note:ev.description||'',link:ev.htmlLink||'',remoteUpdated:ev.updated,dirty:false};
}
async function pullCalendar(){
  const min=addDays(todayStr(),-14),max=addDays(todayStr(),120);
  let items=[],pt='';
  do{
    const q=new URLSearchParams({timeMin:min+'T00:00:00+07:00',timeMax:max+'T00:00:00+07:00',singleEvents:'true',orderBy:'startTime',maxResults:'250'});
    if(pt)q.set('pageToken',pt);
    const r=await gfetch(calUrl('?'+q));
    if(r&&r.items)items=items.concat(r.items);
    pt=(r&&r.nextPageToken)||'';
  }while(pt);
  const seen=new Set();
  for(const ev of items){
    if(ev.status==='cancelled'||!ev.start)continue;
    seen.add(ev.id);
    const p=(ev.extendedProperties&&ev.extendedProperties.private)||{};
    if(p.hwn2==='task'){
      const t=S.tasks.find(x=>x.gcalId===ev.id)||(p.taskId&&S.tasks.find(x=>x.id===p.taskId));
      const f={title:(ev.summary||'').replace(TASK_PREFIX,'')||'(ไม่มีชื่อ)',due:ev.start.date||partsBKK(ev.start.dateTime).date,note:ev.description||'',owner:p.owner||'',priority:PRIO[p.priority]?p.priority:'mid',status:STAT[p.status]?p.status:'todo',gcalId:ev.id,syncCal:true,remoteUpdated:ev.updated,dirty:false};
      if(!t){ S.tasks.push({id:p.taskId||'TASK-'+uid(),createdAt:ev.created||new Date().toISOString(),updatedAt:ev.updated,...f}); t=S.tasks[S.tasks.length-1]; t.dirty=true; }
      else if(t.remoteUpdated!==ev.updated) { Object.assign(t,f,{updatedAt:ev.updated, dirty:true}); }
    }else{
      const m=S.meetings.find(x=>x.gcalId===ev.id),f=evToMeeting(ev);
      if(!m){ S.meetings.push({id:'MEET-'+uid(),...f}); S.meetings[S.meetings.length-1].dirty=true; }
      else if(m.remoteUpdated!==ev.updated){ Object.assign(m,f,{dirty:true}); }
    }
  }
}
let syncing=false;
async function syncCalendar(manual){
  if(syncing)return;
  if(!isConnected()&&!manual){return;}
  syncing=true;setBusy(true);
  try{
    await getToken();
    await syncGASData(); // Load fresh data before syncing
    await pushCalendar();
    await pullCalendar();
    
    // Save any newly created Calendar events back to GAS
    for(const m of S.meetings) if(m.dirty){ await sendToGAS("update", "meeting", m); m.dirty=false; }
    for(const t of S.tasks) if(t.dirty){ await sendToGAS("update", "task", t); t.dirty=false; }
    
    S.lastCalSync=new Date().toISOString();save();renderAll();
    if(manual)toast('ซิงก์ปฏิทินเรียบร้อย');
  }catch(e){toast('ซิงก์ปฏิทินไม่สำเร็จ: '+e.message,'err')}
  finally{syncing=false;setBusy(false)}
}

let scanning=false;
async function scanDrive(manual){
  if(!isConnected()){if(manual)toast('กรุณาเข้าสู่ระบบในหน้าตั้งค่าเพื่อสแกนไดร์ฟ');return}
  if(scanning)return;
  scanning=true;setBusy(true);
  try{
    await getToken();
    
    // ค้นหาไฟล์ทั้งหมดใน Drive ที่ถูกแก้ไขภายในระยะเวลาที่กำหนด
    const daysLimit = S.settings.followUpDays;
    const xDaysAgo = new Date(Date.now() - daysLimit * DAY).toISOString();
    const q = `modifiedTime > '${xDaysAgo}' and trashed = false and mimeType != 'application/vnd.google-apps.folder'`;
    
    let out=[],pt='';
    do {
      const params = new URLSearchParams({
        q: q,
        fields: 'nextPageToken,files(id,name,mimeType,createdTime,modifiedTime,webViewLink,lastModifyingUser(displayName),parents)',
        pageSize: '100',
        orderBy: 'modifiedTime desc'
      });
      if(pt) params.set('pageToken',pt);
      const r = await gfetch('https://www.googleapis.com/drive/v3/files?'+params);
      if(!r) break;
      out = out.concat(r.files||[]);
      pt = r.nextPageToken||'';
    } while(pt && out.length < 500); // ป้องกันดึงมาเยอะเกินไป (ดึงไม่เกิน 500 ไฟล์ล่าสุด)

    let added=0;
    for(const x of out){
      const key = x.id + '|' + x.modifiedTime;
      // ตรวจสอบว่ามีอยู่แล้วหรือไม่
      if(S.alerts.some(a=>a.key===key)) continue;

      let kind = Math.abs(new Date(x.modifiedTime)-new Date(x.createdTime)) < 6e4 ? 'created':'updated';
      let folderLink = x.parents && x.parents.length > 0 ? `https://drive.google.com/drive/folders/${x.parents[0]}` : '';
      
      const newAlert = {
        id: 'ALERT-' + uid(),
        key,
        fileId: x.id,
        name: x.name,
        kind,
        at: x.modifiedTime,
        by: (x.lastModifyingUser&&x.lastModifyingUser.displayName)||'',
        link: x.webViewLink||'',
        folderLink: folderLink,
        mime: x.mimeType,
        folder: 'ไดร์ฟของฉัน', // ไม่ระบุโฟลเดอร์เจาะจงแล้ว
        read: false,
        done: false,
        notified: false
      };
      
      // ลบเวอร์ชันเก่าของไฟล์นี้ที่ยังไม่ได้ติดตามออก
      S.alerts = S.alerts.filter(a => !(a.fileId === x.id && !a.done));
      S.alerts.unshift(newAlert);
      
      await sendToGAS('add', 'alert', newAlert);
      added++;
    }

    S.alerts=S.alerts.slice(0,300); // เก็บไว้ไม่เกิน 300 การแจ้งเตือน
    S.lastDriveScan=new Date().toISOString();
    save();
    await syncGASData();
    
    if(added){toast(`พบการแก้ไขไฟล์ใหม่ ${added} รายการ`);}
    else if(manual){toast('สแกนเสร็จสิ้น ไม่มีไฟล์อัปเดตเพิ่มเติม');}
  }catch(e){toast('สแกน Drive ไม่สำเร็จ: '+e.message,'err')}
  finally{scanning=false;setBusy(false)}
}

const dueAt=a=>new Date(a.at).getTime()+S.settings.followUpDays*DAY;
const isDue=a=>!a.done&&Date.now()>=dueAt(a);

let tf={q:'',st:'all'},mf='up',af='all';

function show(v){

function renderNav(){

  const b=$('#nav [data-view="alerts"] .badge');b.textContent=n;b.hidden=!n;
}
function renderStats(){
  const t=todayStr();
  const open=S.tasks.filter(x=>x.status!=='done').length;
  const late=S.tasks.filter(x=>x.status!=='done'&&x.due&&x.due<t).length;
  const wk=S.meetings.filter(m=>m.date>=t&&m.date<=addDays(t,7)).length;
  const al=S.alerts.filter(a=>!a.done).length,due=S.alerts.filter(isDue).length;
  const T=(n,l,c,v)=>`<button class="tile ${c}" data-act="goto" data-view="${v}"><strong>${n}</strong><span>${l}</span></button>`;
  $('#stats').innerHTML=T(open,'งานที่ค้างอยู่','','tasks')+T(late,'งานเลยกำหนด',late?'bad':'','tasks')+T(wk,'ประชุมใน 7 วันนี้','','meetings')+T(al,due?`ไฟล์รอติดตาม (ครบกำหนด ${due})`:'ไฟล์รอติดตาม',due?'warn':'','alerts');
}
function dueInfo(t){
  if(!t.due)return{txt:'ไม่ระบุกำหนด',cls:''};
  if(t.status==='done')return{txt:fmtDate(t.due),cls:''};
  const d=diffDays(todayStr(),t.due);
  if(d<0)return{txt:`เลยกำหนด ${-d} วัน (${fmtDate(t.due)})`,cls:'bad'};
  if(d===0)return{txt:'ครบกำหนดวันนี้',cls:'warn'};
  return{txt:`อีก ${d} วัน (${fmtDate(t.due)})`,cls:d<=3?'warn':''};
}
function renderTasks(){
  const cnt=k=>k==='all'?S.tasks.length:S.tasks.filter(t=>t.status===k).length;
  $('#t-chips').innerHTML=chips({all:'ทั้งหมด',...STAT},tf.st,cnt,'f-task');
  const q=tf.q.trim().toLowerCase();
  const list=S.tasks.filter(t=>(tf.st==='all'||t.status===tf.st)&&(!q||(t.title+' '+t.owner).toLowerCase().includes(q)))
    .sort((a,b)=>(a.status==='done')-(b.status==='done')||(a.due||'9999').localeCompare(b.due||'9999'));
  $('#t-list').innerHTML=list.length?list.map(t=>{
    const d=dueInfo(t);
    return`<article class="card task pr-${t.priority} st-${t.status}" data-id="${t.id}">
      <div class="tbody" data-act="edit-task">
        ${t.priority!=='low'?`<span class="tag p-${t.priority}">${PRIO[t.priority]}</span>`:''}
        <h3>${esc(t.title)}</h3>
        <div class="meta">
          ${t.owner?`<span>${I.user}${esc(t.owner)}</span>`:''}
          <span class="${d.cls}">${I.clock}${esc(d.txt)}</span>
          ${t.syncCal?`<span>${I.cal}${t.gcalId&&!t.dirty?'อยู่บนปฏิทินแล้ว':'รอซิงก์ขึ้นปฏิทิน'}</span>`:''}
        </div>
      </div>
      <div class="tactions">
        <button class="stbtn st-${t.status}" data-act="cycle-status" title="แตะเพื่อเปลี่ยนสถานะ">${STAT[t.status]}</button>
        <button class="icon-btn sm danger" data-act="del-task" aria-label="ลบงาน">${I.trash}</button>
      </div></article>`}).join(''):empty(S.tasks.length?'ไม่พบงานตามเงื่อนไข':'ยังไม่มีงาน','กดปุ่ม "เพิ่มงาน" เพื่อเริ่มบันทึกงานแรก');
}
function renderMeetings(){
  const t=todayStr();
  $('#m-chips').innerHTML=chips({up:'กำลังจะถึง',past:'ที่ผ่านมา'},mf,null,'f-meet');
  $('#m-sync').textContent=S.lastCalSync?'ซิงก์ปฏิทินล่าสุด '+ago(S.lastCalSync):'';
  let list=S.meetings.filter(m=>mf==='up'?m.date>=t:m.date<t);
  list.sort((a,b)=>(mf==='up'?1:-1)*(a.date+a.start).localeCompare(b.date+b.start));
  if(!list.length){$('#m-list').innerHTML=empty(mf==='up'?'ไม่มีการประชุมที่กำลังจะถึง':'ไม่มีการประชุมที่ผ่านมา','กดปุ่ม "เพิ่มการประชุม" เพื่อสร้างตารางนัดหมาย');return}
  let h='',cur='';
  for(const m of list){
    if(m.date!==cur){
      cur=m.date;const d=diffDays(t,m.date);
      const rel=d===0?'วันนี้':d===1?'พรุ่งนี้':d===-1?'เมื่อวาน':'';
      h+=`<div class="dayhead">${fmtLong(m.date)}${rel?`<small>${rel}</small>`:''}</div>`;
    }
    const safe=/^https:\/\//.test(m.link||'')?m.link:'';
    h+=`<article class="card meet" data-id="${m.id}">
      <div class="mtime">${m.start?esc(m.start)+(m.end&&m.end!==m.start?'-'+esc(m.end):''):'ทั้งวัน'}</div>
      <div class="mbody"><h3>${esc(m.title)}</h3>
        <div class="meta">${m.location?`<span>${I.pin}${esc(m.location)}</span>`:''}${m.gcalId&&!m.dirty?`<span>${I.cal}จาก Google Calendar</span>`:m.syncCal?`<span class="pend">${I.sync}รอซิงก์ขึ้นปฏิทิน</span>`:''}</div>
        ${m.note?`<div class="meta" style="margin-top:4px">${esc(m.note.slice(0,160))}</div>`:''}
      </div>
      <div class="mact">
        ${safe?`<a class="icon-btn sm" href="${esc(safe)}" target="_blank" rel="noopener" aria-label="เปิดใน Google Calendar">${I.ext}</a>`:''}
        <button class="icon-btn sm" data-act="edit-meeting" aria-label="แก้ไข">${I.edit}</button>
        <button class="icon-btn sm danger" data-act="del-meeting" aria-label="ลบ">${I.trash}</button>
      </div></article>`;
  }
  $('#m-list').innerHTML=h;
}
function fileKind(m,n){
  m=m||'';n=n||'';
  if(m.includes('document')||/\.docx?$/i.test(n))return['DOC','#6aa8ff'];
  if(m.includes('spreadsheet')||m.includes('excel')||/\.(xlsx?|csv)$/i.test(n))return['XLS','#4cd07d'];
  if(m.includes('presentation')||/\.pptx?$/i.test(n))return['PPT','#ff9a4d'];
  if(m.includes('pdf')||/\.pdf$/i.test(n))return['PDF','#ff5d4f'];
  if(m.startsWith('image/'))return['IMG','#c58bff'];
  return['FILE','#a3a3a3'];
}
function alertCard(a){
  const N=S.settings.followUpDays,el=(Date.now()-new Date(a.at))/DAY,pct=Math.min(100,Math.max(2,el/N*100)),due=isDue(a);
  const[kt,kc]=fileKind(a.mime,a.name),pb=partsBKK(a.at);
  const prog=a.done?'ติดตามแล้ว':due?`ครบ ${N} วันแล้ว${el-N>=1?` เกินมา ${Math.floor(el-N)} วัน`:''}`:`อีก ${Math.max(1,Math.ceil(N-el))} วันจะครบ ${N} วัน`;
  const safe=/^https:\/\//.test(a.link||'')?a.link:'';
  return`<article class="card alert${a.read?'':' unread'}${due?' due':''}${a.done?' done':''}" data-id="${a.id}">
    <div class="ftype" style="--c:${kc}">${kt}</div>
    <div class="abody">
      <div><span class="tag ${a.kind}">${a.kind==='created'?'ไฟล์ใหม่':'อัปเดตไฟล์'}</span>${due?'<span class="tag duetag">ถึงกำหนดติดตาม</span>':''}</div>
      <h3>${esc(a.name)}</h3>
      <div class="meta"><span>${I.clock}${ago(a.at)} (${fmtDate(pb.date)} ${pb.time} น.)</span>${a.by?`<span>${I.user}${esc(a.by)}</span>`:''}</div>
      <div class="prog"><div class="bar${due?' hz':''}"><i style="width:${pct}%"></i></div><small>${prog}</small></div>
      <div class="arow">
        ${safe?`<a class="btn sm" href="${esc(safe)}" target="_blank" rel="noopener" data-act="open-file">${I.ext}เปิดไฟล์</a>`:''}
        ${a.folderLink ? `<a class="btn sm ghost" href="${esc(a.folderLink)}" target="_blank" rel="noopener">${I.folder}ที่อยู่ไฟล์</a>` : ''}
        ${a.done?'':`<button class="btn sm ghost" data-act="done-alert">${I.check}รับทราบ</button>`}
        <button class="icon-btn sm danger" data-act="del-alert" aria-label="ลบการแจ้งเตือน">${I.trash}</button>
      </div></div></article>`;
}
function renderAlerts(){
  const N=S.settings.followUpDays;
  const flt={all:()=>true,new:a=>!a.done&&!a.read&&!isDue(a),due:isDue,done:a=>a.done};
  const cnt=k=>S.alerts.filter(flt[k]).length;
  $('#a-chips').innerHTML=chips({all:'ทั้งหมด',new:'ใหม่',due:`ครบ ${N} วัน`,done:'รับทราบแล้ว'},af,cnt,'f-alert');
  $('#a-sync').textContent=S.lastDriveScan?'สแกนล่าสุด '+ago(S.lastDriveScan):'';
  const list=S.alerts.filter(flt[af]).sort((a,b)=>(isDue(b)-isDue(a))||(new Date(b.at)-new Date(a.at)));
  $('#a-list').innerHTML=list.length?list.map(alertCard).join(''):empty('ยังไม่มีการแจ้งเตือนไฟล์','เมื่อกด "สแกนไฟล์ในไดร์ฟ" ข้อมูลจะมาแสดงที่นี่');
}
function renderSettings(){
  const s=S.settings;
  const perm='Notification' in window?Notification.permission:'denied';
  $('#settings').innerHTML=`
  <div class="card"><h3>การแจ้งเตือนและระบบเบื้องหลัง</h3>
    <p class="hint">ระบบจะเชื่อมข้อมูลอัตโนมัติเมื่อมีการเปิดหน้านี้ทิ้งไว้ (มีแจ้งเตือนเมื่อเพิ่มการประชุม)</p>
    <label>จำนวนวันสำหรับการแจ้งเตือนติดตามไฟล์ (วัน)<input id="s-days" type="number" min="1" max="60" value="${s.followUpDays}" style="max-width:140px"></label>
    <label class="chk"><input type="checkbox" id="s-auto" ${s.autoSync?'checked':''}><span>ซิงก์ข้อมูลอัตโนมัติทุก 10 วินาที</span></label>
    <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="notif-perm"${perm==='granted'?' disabled':''}>${I.bell}${perm==='granted'?'เปิดการแจ้งเตือนบนเบราว์เซอร์แล้ว':perm==='denied'?'การแจ้งเตือนถูกบล็อกในเบราว์เซอร์':'เปิดการแจ้งเตือนบนเบราว์เซอร์'}</button></div>
  </div>
  <div class="card"><h3>บัญชี Google สำหรับสแกนไดร์ฟ (Admin)</h3>
    <p class="hint">ต้องล็อกอินบัญชี Google เฉพาะเมื่อต้องการกดปุ่มสแกนไดร์ฟ</p>
    <div class="row"><button class="btn" data-act="connect">${isConnected()?'เชื่อมต่อใหม่':'เข้าสู่ระบบ Google'}</button>${isConnected()?'<button class="btn ghost" data-act="disconnect">ออกจากระบบ</button>':''}</div>
  </div>`;
}
function renderAll(){renderStats();renderTasks();renderMeetings();renderAlerts();renderNav();if(!$('#view-settings').hidden)renderSettings()}

function taskForm(id){
  const old=id?S.tasks.find(x=>x.id===id):null;
  const t=old||{title:'',owner:'',due:'',priority:'mid',status:'todo',note:'',syncCal:false};
  openModal(`<form id="tf" autocomplete="off">
    <div class="mh"><h2>${old?'แก้ไขงาน':'เพิ่มงานใหม่'}</h2><button type="button" class="icon-btn" data-act="close" aria-label="ปิด">${I.x}</button></div>
    <label>ชื่องาน<input name="title" required maxlength="200" value="${esc(t.title)}" placeholder="เช่น จัดทำแผนงานซ่อมบำรุงประจำปี"></label>
    <div class="two"><label>ผู้รับผิดชอบ<input name="owner" maxlength="80" value="${esc(t.owner)}"></label><label>วันครบกำหนด<input type="date" name="due" value="${esc(t.due)}"></label></div>
    <div class="two"><label>ความสำคัญ<select name="priority">${opt(PRIO,t.priority)}</select></label><label>สถานะ<select name="status">${opt(STAT,t.status)}</select></label></div>
    <label>รายละเอียด<textarea name="note" rows="3" maxlength="2000">${esc(t.note)}</textarea></label>
    <label class="chk"><input type="checkbox" name="syncCal"${t.syncCal?' checked':''}><span>แสดงงานนี้บน Google Calendar (ซิงก์สองทาง)</span></label>
    <div class="mf"><button type="button" class="btn ghost" data-act="close">ยกเลิก</button><button class="btn">บันทึก</button></div></form>`);
  $('#tf').addEventListener('submit',async e=>{
    e.preventDefault();const f=new FormData(e.target);
    const d={title:f.get('title').trim(),owner:f.get('owner').trim(),due:f.get('due')||'',priority:f.get('priority'),status:f.get('status'),note:f.get('note').trim(),syncCal:f.get('syncCal')==='on'};
    if(!d.title)return;
    if(d.syncCal&&!d.due){toast('ต้องระบุวันครบกำหนด จึงจะแสดงบนปฏิทินได้','err');return}
    closeModal();
    
    const now=new Date().toISOString();
    let taskObj;
    if(old){
      taskObj = {...old, ...d, updatedAt:now, dirty:true};
      Object.assign(old, taskObj); // อัปเดตฝั่งผู้ใช้ทันทีให้ดูไว
    }else{
      taskObj = {id:'TASK-'+uid(),createdAt:now,updatedAt:now,gcalId:null,dirty:true,...d};
      S.tasks.push(taskObj);
    }
    renderAll();
    
    // บันทึกลงส่วนกลาง แล้วดึงกลับมาให้ตรงกัน
    await sendToGAS(old?"update":"add", "task", taskObj);
    await syncGASData();
    toast(old?'บันทึกการแก้ไขแล้ว':'เพิ่มงานแล้ว');
  });
}
function meetingForm(id){
  const old=id?S.meetings.find(x=>x.id===id):null;
  const m=old||{title:'',date:todayStr(),start:'09:00',end:'10:00',location:'',note:''};
  const allDay=old&&!old.start;
  openModal(`<form id="mf" autocomplete="off">
    <div class="mh"><h2>${old?'แก้ไขการประชุม':'เพิ่มการประชุม'}</h2><button type="button" class="icon-btn" data-act="close" aria-label="ปิด">${I.x}</button></div>
    <label>หัวข้อการประชุม<input name="title" required maxlength="200" value="${esc(m.title)}"></label>
    <label>วันที่<input type="date" name="date" required value="${esc(m.date)}"></label>
    <label class="chk" style="margin-bottom:10px"><input type="checkbox" name="allDay" id="mAll"${allDay?' checked':''}><span>ทั้งวัน</span></label>
    <div class="two"><label>เวลาเริ่ม<input type="time" name="start" value="${esc(m.start||'09:00')}"${allDay?' disabled':''}></label><label>เวลาสิ้นสุด<input type="time" name="end" value="${esc(m.end||'10:00')}"${allDay?' disabled':''}></label></div>
    <label>สถานที่<input name="location" maxlength="200" value="${esc(m.location)}"></label>
    <label>รายละเอียด<textarea name="note" rows="3" maxlength="2000">${esc(m.note)}</textarea></label>
    <div class="mf"><button type="button" class="btn ghost" data-act="close">ยกเลิก</button><button class="btn">บันทึก</button></div></form>`);
  $('#mAll').addEventListener('change',e=>{$$('#mf input[type=time]').forEach(i=>i.disabled=e.target.checked)});
  $('#mf').addEventListener('submit',async e=>{
    e.preventDefault();const f=new FormData(e.target),all=f.get('allDay')==='on';
    const d={title:f.get('title').trim(),date:f.get('date'),start:all?'':f.get('start'),end:all?'':f.get('end'),location:f.get('location').trim(),note:f.get('note').trim()};
    if(!d.title||!d.date)return;
    if(!all&&(!d.start||!d.end||d.end<=d.start)){toast('เวลาสิ้นสุดต้องหลังเวลาเริ่ม','err');return}
    closeModal();
    
    let meetObj;
    if(old){
      meetObj = {...old, ...d, dirty:true};
      Object.assign(old, meetObj);
    }else{
      meetObj = {id:'MEET-'+uid(),gcalId:null,dirty:true,...d};
      S.meetings.push(meetObj);
    }
    renderAll();
    
    await sendToGAS(old?"update":"add", "meeting", meetObj);
    await syncGASData();
    toast(old?'บันทึกการแก้ไขแล้ว':'เพิ่มการประชุมแล้ว');
  });
}
async function delItem(kind,id){
  const arr=kind==='task'?S.tasks:S.meetings;
  const i=arr.findIndex(x=>x.id===id);
  if(i<0)return;
  const it = arr[i];
  
  if(!confirm(`ต้องการลบ "${it.title}" แบบถาวรใช่หรือไม่?`)) return;

  arr.splice(i,1); // ลบออกจาหน้าจอผู้ใช้ก่อนเพื่อความรวดเร็ว
  save(); renderAll();
  
  toast(`กำลังลบข้อมูลออกจากส่วนกลาง...`);
  await sendToGAS("delete", kind, { id: id });
  await syncGASData(); // ยืนยันการเปลี่ยนแปลงด้วยการดึงข้อมูลล่าสุด
  toast(`ลบ "${it.title}" เรียบร้อยแล้ว`);
}

document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-act]');
  if(!b)return;
  const act=b.dataset.act,card=b.closest('[data-id]'),id=card&&card.dataset.id;
  switch(act){
    case'close':closeModal();break;
    case'goto':show(b.dataset.view);break;
    case'add-task':taskForm();break;
    case'edit-task':taskForm(id);break;
    case'cycle-status':{
      const t=S.tasks.find(x=>x.id===id);if(!t)break;
      t.status={todo:'doing',doing:'done',done:'todo'}[t.status];t.updatedAt=new Date().toISOString();t.dirty=true;
      save();renderAll();
      await sendToGAS("update", "task", t);
      await syncGASData();
      break;
    }
    case'del-task':delItem('task',id);break;
    case'add-meeting':meetingForm();break;
    case'edit-meeting':meetingForm(id);break;
    case'del-meeting':delItem('meeting',id);break;
    case'f-task':tf.st=b.dataset.v;renderTasks();break;
    case'f-meet':mf=b.dataset.v;renderMeetings();break;
    case'f-alert':af=b.dataset.v;renderAlerts();break;
    case'open-file':{
      const a=S.alerts.find(x=>x.id===id);
      if(a){a.read=true;save();card.classList.remove('unread');renderNav();renderStats()}
      break;
    }
    case'done-alert':{
      const a=S.alerts.find(x=>x.id===id);
      if(a){
        a.done=true;a.read=true;save();renderAlerts();renderNav();renderStats();
        toast('บันทึกว่ารับทราบแล้ว');
        await sendToGAS("update", "alert", a);
        await syncGASData();
      }
      break;
    }
    case'del-alert':{
      if(!confirm(`ต้องการลบการแจ้งเตือนไฟล์นี้ใช่หรือไม่?`)) return;
      S.alerts=S.alerts.filter(x=>x.id!==id);
      save();renderAlerts();renderNav();renderStats();
      await sendToGAS("delete", "alert", {id: id});
      await syncGASData();
      break;
    }
    case'sync-all':
      await syncGASData();
      toast('ซิงก์ดึงข้อมูลจากส่วนกลางเรียบร้อย');
      if (isConnected()) await syncCalendar(false);
      break;
    case'scan-drive':scanDrive(true);break;
    case'connect':
      try{await getToken();toast('เข้าสู่ระบบ Google แล้ว');}
      catch(err){toast(err.message,'err')}
      break;
    case'disconnect':
      try{if(token&&window.google&&google.accounts)google.accounts.oauth2.revoke(token,()=>{})}catch(err){}
      token=null;tokExp=0;try{sessionStorage.removeItem('hwn2.tok')}catch(err){}
      renderSettings();toast('ออกจากระบบเรียบร้อย');break;
    case'notif-perm':
      if('Notification' in window){const r=await Notification.requestPermission();renderSettings();toast(r==='granted'?'เปิดการแจ้งเตือนแล้ว':'เบราว์เซอร์ไม่อนุญาตการแจ้งเตือน',r==='granted'?'':'err')}
      break;
  }
});

$('#t-search').addEventListener('input',e=>{tf.q=e.target.value;renderTasks()});
$('#settings').addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='s-days'){S.settings.followUpDays=Math.min(60,Math.max(1,parseInt(e.target.value,10)||7));e.target.value=S.settings.followUpDays;save();renderAlerts();renderNav();renderStats()}
  else if(id==='s-auto'){S.settings.autoSync=e.target.checked;save()}
});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)show(b.dataset.view)});

function autoRun(){
  if(S.settings.autoSync&&!document.hidden){
    syncGASData(); // ดึงข้อมูลทุกๆ 10 วินาที
  }
}

// Polling อัตโนมัติทุกๆ 10 วินาที
setInterval(autoRun, 10000);

document.addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  autoRun(); // ดึงทันทีเมื่อสลับกลับมาที่หน้าเว็บ
});

/* boot */
renderChrome();renderAll();
show((location.hash||'').slice(1)||'tasks');
syncGASData();
})();
</script>
